[package]
name = "lampz-sync"
version = "0.1.0"
description = "Windows desktop app that mirrors monitor colors to a local Tuya lamp."
authors = ["Zied Harzallah"]
license = "MIT"
repository = "https://github.com/TBG101/LampZ-Sync"
readme = "../README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lampz_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2.0.1"
rustuya = "0.3.0"
rand = "0.10.2"
tauri-plugin-store = "2"
ts-rs = "12"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
schemars = "1.2.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
